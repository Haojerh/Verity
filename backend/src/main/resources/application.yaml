spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Verity

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/Verity}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  logging:
  level:
    org:
      springframework:
        security: DEBUG

gemini:
  api:
    key: ${API_KEY}