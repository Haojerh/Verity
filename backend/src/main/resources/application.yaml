spring:
  application:
    name: Verity

  datasource:
    url: jdbc:mysql://localhost:3306/Verity?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  logging:
  level:
    org:
      springframework:
        security: DEBUG